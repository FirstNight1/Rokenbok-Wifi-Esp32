<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ vehicle_name }} - Home</title>
    <link rel="icon" href="/assets/favicon.ico">
</head>

<body>
    {{ header_nav }}
    <div style='max-width:600px;margin:32px auto 0 auto;text-align:center;'>
        <p><b>Vehicle Name:</b> <span id='vehicle_name'>Loading...</span></p>
        <p><b>Vehicle Type:</b> <span id='vehicle_type'>Loading...</span></p>
        <p><b>Vehicle Tag:</b> <span id='vehicle_tag'>Loading...</span></p>
        <p><b>Status:</b> <span id='vehicle_status'>Loading...</span></p>
        <p><b>Battery Level:</b> <span id='vehicle_battery'>N/A</span></p>
        <p><b>MCU Temp:</b> <span id='mcu_temp'>N/A</span> &deg;C</p>
        <p><b>Memory:</b> <span id='memory_info'>{{ memory_info }}</span></p>
        <p><b>WiFi Signal:</b> <span id='wifi_signal'>Loading...</span></p>
        <p><b>IP Address:</b> {{ ip }}</p>
    </div>
    <script>
        // Initialize with server-side values from config - no fallbacks needed
        document.getElementById('vehicle_name').textContent = '{{ vehicle_name }}';
        document.getElementById('vehicle_type').textContent = '{{ device_type }}';
        document.getElementById('vehicle_tag').textContent = '{{ vehicle_tag }}'; // From config, not API

        // Fetch dynamic status (temperature, battery, busy state)
        fetch('/api/status').then(r => r.json()).then(js => {

            // Project type determines if busy status is available
            {{ busy_status_script }}

            document.getElementById('vehicle_battery').textContent = js.battery !== undefined && js.battery !== null ? js.battery : 'N/A';
            
            // Parse temperature - expect numeric value from API
            if (js.mcuTemp && js.mcuTemp !== 'N/A') {
                if (typeof js.mcuTemp === 'number') {
                    document.getElementById('mcu_temp').textContent = js.mcuTemp;
                } else if (typeof js.mcuTemp === 'string') {
                    // Handle string numbers or existing formatted strings
                    const numTemp = parseFloat(js.mcuTemp.replace(/[^\d.]/g, ''));
                    document.getElementById('mcu_temp').textContent = isNaN(numTemp) ? js.mcuTemp : numTemp;
                } else {
                    document.getElementById('mcu_temp').textContent = js.mcuTemp;
                }
            } else {
                document.getElementById('mcu_temp').textContent = 'N/A';
            }

            // Update memory if API provides it
            if (js.memoryFree) {
                const memKB = Math.round(js.memoryFree / 1024);
                document.getElementById('memory_info').textContent = `${memKB} KB free`;
            }
            
            // Update WiFi signal strength
            if (js.wifiSignal !== undefined) {
                const signal = js.wifiSignal;
                if (signal === 0) {
                    document.getElementById('wifi_signal').textContent = 'AP Mode';
                    document.getElementById('wifi_signal').style.color = '#ffa500';
                } else {
                    document.getElementById('wifi_signal').textContent = `${signal} dBm`;
                    // Color code signal strength (green > -50, yellow > -70, red < -70)
                    if (signal > -50) {
                        document.getElementById('wifi_signal').style.color = '#28a745';
                    } else if (signal > -70) {
                        document.getElementById('wifi_signal').style.color = '#ffc107';
                    } else {
                        document.getElementById('wifi_signal').style.color = '#dc3545';
                    }
                }
            } else {
                document.getElementById('wifi_signal').textContent = 'N/A';
            }
        }).catch(e => {
            console.error('Status fetch failed:', e);
            // Keep static config values, just set reasonable defaults for dynamic ones
            document.getElementById('vehicle_tag').textContent = 'N/A';
            document.getElementById('vehicle_status').textContent = 'Device is ready';
            document.getElementById('vehicle_status').style.color = '#28a745';
        });
    </script>
</body>

</html>
